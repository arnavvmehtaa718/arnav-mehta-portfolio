      /* Static first frame of the hero, painted straight from HTML before any JS. The stacked (phone) layout keeps it
           as the hero backdrop; the sideways desktop layout moves the node into its hero panel. */
      body { margin: 0; background: #0a0a0a; }
      .pre { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100svh; overflow: hidden; }
      .pre { background: #050505; }
      .pre picture { position: absolute; inset: 0; display: block; }
      .pre img { position: absolute; top: 0; right: 0; height: 100%; width: auto; max-width: none }
      @media (max-width: 899px), (max-aspect-ratio: 1/1) { .pre img { left: 0; right: auto; top: 4.5rem; width: 100%; height: auto; } }

      /* Static copy of the hero text in a system font, so the largest text paints before JS and can't shift when web fonts land.
         App removes it the moment the live hero text is revealed. */
      .pre .hero { position: absolute; inset: 0; z-index: 2; height: 100%; min-height: 0; }
      .pre .hero__content { visibility: visible !important; }
      .pre .hero__content, .pre .hero__content * { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif !important; }
      .pre .mask > span { transform: none; animation: none; }
      /* a touch larger than the live text, so the live copy never registers as a later, larger LCP candidate */
      .pre .hero__sub { font-size: calc(clamp(1.1rem, 1.6vw, 1.45rem) * 1.15); max-width: 32ch; }
    </style>
